# Gradle daemon: avoid huge heap + metaspace together (can starve the Kotlin child process on 16GB RAM + emulator).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compile daemon memory (separate JVM from Gradle).
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# If the Kotlin daemon still exits immediately (error code 0), compile inside the Gradle worker instead.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
